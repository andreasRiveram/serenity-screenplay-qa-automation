serenity {
  take.screenshots = FOR_EACH_ACTION
}

webdriver {
  driver = chrome
    autodownload = true
    capabilities {
      browserName = "chrome"
      acceptInsecureCerts = true
      "goog:chromeOptions" {
        args = [
          "--remote-allow-origins=*",
          "--no-sandbox",
          "--disable-dev-shm-usage",
          "--start-maximized"
      ]
    }
  }
}

environments {
default {
    webdriver.base.url = "https://selenium.dev"
  }
  dev {
    webdriver.base.url = "https://selenium.dev"
  }
}

api {
  base.url = "https://reqres.in"
}